services:
  valdez:
    build: .
    image: valdez-bot:latest
    container_name: valdez-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    working_dir: /app
    environment:
      VALDEZ_DB_PATH: /app/data/valdez.db
      YT_COOKIES_PATH: /app/data/youtube-cookies.txt
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
