services:
  valdez:
    build: .
    image: valdez-bot:latest
    container_name: valdez-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    working_dir: /app
    environment:
      VALDEZ_DB_PATH: /app/data/valdez.db
      YT_COOKIES_PATH: /app/data/youtube-cookies.txt
      HEALTH_PORT: 3000
    mem_limit: 1g
    mem_reservation: 384m
    cpus: 2.0
    oom_score_adj: -500
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: valdez-autoheal
    restart: unless-stopped
    mem_limit: 64m
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
